<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dekken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#FEE440">
<meta name="description" content="Dekken: papan kartu tempel untuk kelas paralel. Tumpuk, balas, dan naikkan!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dekken">
<script src="vendor/supabase.js"></script>
<style>
  :root {
    --h:#000; --p:#fff; --abu:#555; --kuning:#FEE440;
    --c-enam: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
    --c-lima: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%);
  }
  /* mode gelap: latar jadi hitam, teks putih; kartu tetap berwarna dengan teks gelap */
  :root[data-tema="gelap"] { --h:#fff; --p:#000; --abu:#aaa; }
  :root[data-tema="gelap"] .kartu, :root[data-tema="gelap"] .balas, :root[data-tema="gelap"] .kompos,
  :root[data-tema="gelap"] #bantuan .lembar, :root[data-tema="gelap"] .kontrol { --h:#000; --p:#fff; --abu:#555; color:#000; }
  :root[data-tema="gelap"] .kartu:not(.lapis), :root[data-tema="gelap"] .balas { filter:brightness(.92); }
  :root[data-tema="gelap"] #bantuan { background:rgba(0,0,0,.72); }
  :root[data-tema="gelap"] .petunjuk { background:#000; color:#fff; }
  :root[data-tema="gelap"] #toast { box-shadow:0 0 0 6px rgba(0,0,0,.85); }
  :root[data-tema="gelap"] .ikon { background:#777; }
  :root[data-tema="gelap"] .ikon:hover, :root[data-tema="gelap"] .ikon.pilih { background:#fff; }
  :root[data-tema="gelap"] .item.terbuka > .bingkai path { fill:#2b2b2b; }
  * { box-sizing: border-box; }
  body { padding-top:var(--hh,72px); padding-bottom:84px; margin:0; background-color:var(--p); color:var(--h); font-family:Arial, Helvetica, sans-serif; line-height:1.35; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
           margin:0; padding:22px 16px 10px;
           position:fixed; left:0; right:0; top:0; z-index:30; pointer-events:none; }   /* tetap di atas saat digulir (juga saat digeser ke samping), latar transparan */
  header .judul, header .kanan { pointer-events:auto; }   /* judul rapat kiri layar, kontrol rapat kanan layar */
  h1 { margin:0; font-size:14px; font-weight:400; white-space:nowrap; }   /* sama dengan huruf tombol (14px); Dekken mengecil dari D 14pt ke n 14px, tagline dan timer sebesar n */
  h1 b { font-weight:700; }
  @media (max-width:640px) {
    h1 { font-size:12px; white-space:normal; line-height:1.25; }   /* sama dengan huruf tombol di HP */
  }
  footer { max-width:1200px; margin:0 auto; padding:0 24px 16px; text-align:left; font-size:11px; color:var(--h); }
  @media (min-width:900px) {
    footer { position:fixed; left:0; bottom:0; margin:0; padding:0 0 10px 16px; z-index:15; pointer-events:none; }
  }
  .judul { flex:1 1 auto; min-width:0; }
  #timer { font-size:1em; font-weight:700; margin-left:12px; white-space:nowrap; }
  #bantuan { position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center; padding:16px;
             background:rgba(255,255,255,.72); }
  #bantuan.buka { display:flex; }
  #bantuan .lembar { background:#fff; border:2px solid #000; width:100%; max-width:560px; max-height:86vh; overflow:auto; padding:20px 24px 22px;
                     font-family:'Shantell Sans','Segoe Print','Bradley Hand',cursive; font-size:15px; line-height:1.45; transform:rotate(-.4deg); }
  #bantuan h2 { margin:0 0 10px; font-size:21px; }
  #bantuan h3 { margin:14px 0 2px; font-size:16px; }
  #bantuan p { margin:0; }
  #bantuan .tutup-bantuan { margin-top:18px; }
  #bantuan .ikon.kecil { display:inline-block; width:14px; height:14px; margin:0 3px; vertical-align:-2px; background:#555; cursor:default; }
  #statistik { position:fixed; right:12px; bottom:12px; z-index:26; width:230px; background:var(--p); color:var(--h); border:2px solid var(--h); font-size:14px; }
  #stat-judul { display:flex; justify-content:space-between; align-items:center; width:100%; font:inherit; font-weight:700; background:var(--h); color:var(--p); border:none; padding:6px 10px; cursor:pointer; }
  #statistik.tutup { width:auto; }
  #statistik.tutup #stat-isi { display:none; }
  #statistik.tutup #stat-judul { gap:10px; }
  #stat-isi { padding:8px 12px 10px; line-height:1.7; }
  #stat-isi .baris-s { display:flex; justify-content:space-between; }
  #stat-isi .nama-s { margin-top:6px; font-size:13px; line-height:1.45; color:var(--abu); overflow-wrap:anywhere; }
  @media (max-width:640px) { #statistik { right:8px; bottom:58px; } }
  @media (max-width:640px) { .kanan { gap:5px; } .kanan select, .kanan .btn { font-size:12px !important; padding:3px 6px !important; min-width:0 !important; } #urut { max-width:105px; } #btn-akun { max-width:90px; } }
  .kanan { display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:8px; }
  #urut { font:inherit; font-size:14px; padding:4px 8px; background:var(--p); color:var(--h); border:2px solid var(--h); border-radius:0; cursor:pointer; }
  #btn-rapi { border:2px solid var(--h); padding:4px 10px; font-size:14px; }
  #btn-rapi[aria-pressed="true"] { background:var(--h); color:var(--p); }
  #login { display:flex; align-items:center; gap:10px; font-size:14px; min-height:40px; }

  /* deretan tombol bentuk */
  #alat { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:18px;
          padding:10px 16px calc(10px + env(safe-area-inset-bottom)); font-size:14px; pointer-events:none; }
  #alat > * { pointer-events:auto; }
  #bentuk-baris { display:contents; }
  #bentuk-baris.belum > .ikon, #bentuk-baris.belum > .petunjuk { display:none; }
  .daftar-kotak { display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; background:var(--h); color:var(--p); padding:8px 14px; font-size:14px; }
  .daftar-kotak .btn { background:var(--p); color:var(--h); border-color:var(--p); }
  @media (max-width:640px) {   /* HP: deretan bentuk tetap di tengah bawah */
    #alat { gap:10px; padding-left:8px; padding-right:8px; }
    #alat .ikon:not(.kecil) { width:28px; height:28px; }
    .petunjuk { order:3; }
  }
  #tema-wrap { position:relative; display:inline-flex; }
  #menu-tema { position:absolute; right:0; top:calc(100% + 6px); z-index:40; display:flex; gap:4px; padding:4px; background:var(--p); border:2px solid var(--h); }
  #menu-tema[hidden] { display:none; }
  #akun-wrap { position:relative; display:inline-flex; }
  #btn-akun { max-width:160px; overflow:hidden; text-overflow:ellipsis; border:2px solid var(--h); padding:4px 10px; font-size:14px; }
  #menu-akun, #menu-ruang { position:absolute; right:0; top:calc(100% + 6px); z-index:40; padding:4px; background:var(--p); border:2px solid var(--h); }
  #menu-akun[hidden] { display:none; }
  #menu-akun button, #menu-ruang button { font:inherit; font-size:14px; white-space:nowrap; min-width:90px; padding:6px 12px; background:var(--p); color:var(--h); border:2px solid transparent; cursor:pointer; }
  #menu-akun button:hover, #menu-ruang button:hover { border-color:var(--h); }
  #menu-tema button { font:inherit; font-size:16px; line-height:1; min-width:36px; padding:6px 8px; background:var(--p); color:var(--h); border:2px solid transparent; cursor:pointer; }
  #menu-tema button:hover { border-color:var(--h); }
  #menu-tema button.aktif, #menu-ruang button.aktif { background:var(--h); color:var(--p); }
  html[data-latar="mati"] #titik { display:none; }
  /* monokrom: hanya hitam dan putih, kontras penuh */
  :root[data-mono="1"] .dek .teks { color:inherit !important; }
  :root[data-mono="1"] .dek .btn.garis { border-color:var(--h); }
  :root[data-mono="1"] .kartu:not(.lapis), :root[data-mono="1"] .balas { filter:none !important; }
  :root[data-mono="1"][data-tema="terang"] .dek .kartu { --h:#fff; --p:#000; --abu:#ccc; background:#000 !important; color:#fff; }
  :root[data-mono="1"][data-tema="terang"] .dek .balas { --h:#000; --p:#fff; --abu:#555; background:#fff !important; color:#000; box-shadow:inset 0 0 0 1px #000; }
  :root[data-mono="1"][data-tema="terang"] .dek .lapis.kartu { background:#fff !important; box-shadow:inset 0 0 0 1px #000; }
  :root[data-mono="1"][data-tema="terang"] .item.terbuka > .bingkai path { fill:#e0e0e0; }
  :root[data-mono="1"][data-tema="gelap"] .dek .kartu { --h:#000; --p:#fff; --abu:#555; background:#fff !important; color:#000; }
  :root[data-mono="1"][data-tema="gelap"] .dek .balas { --h:#fff; --p:#000; --abu:#ccc; background:#000 !important; color:#fff; box-shadow:inset 0 0 0 1px #fff; }
  :root[data-mono="1"][data-tema="gelap"] .dek .lapis.kartu { background:#000 !important; box-shadow:inset 0 0 0 1px #fff; }
  :root[data-mono="1"][data-tema="gelap"] .item.terbuka > .bingkai path { fill:#333; }
  /* bentuk bersudut (clip-path): garis tepi 1px digambar dengan lapisan yang dipotong sama */
  :root[data-mono="1"][data-tema="terang"] .dek .balas.kartu.b-enam { background:#000 !important; box-shadow:none; isolation:isolate; }
  :root[data-mono="1"][data-tema="terang"] .dek .balas.kartu.b-enam::before { content:""; position:absolute; inset:1px; z-index:-1; background:#fff; clip-path:var(--c-enam); }
  :root[data-mono="1"][data-tema="terang"] .dek .lapis.kartu.b-enam { background:#000 !important; box-shadow:none; isolation:isolate; }
  :root[data-mono="1"][data-tema="terang"] .dek .lapis.kartu.b-enam::before { content:""; position:absolute; inset:1px; z-index:-1; background:#fff; clip-path:var(--c-enam); }
  :root[data-mono="1"][data-tema="terang"] .dek .balas.kartu.b-lima { background:#000 !important; box-shadow:none; isolation:isolate; }
  :root[data-mono="1"][data-tema="terang"] .dek .balas.kartu.b-lima::before { content:""; position:absolute; inset:1px; z-index:-1; background:#fff; clip-path:var(--c-lima); }
  :root[data-mono="1"][data-tema="terang"] .dek .lapis.kartu.b-lima { background:#000 !important; box-shadow:none; isolation:isolate; }
  :root[data-mono="1"][data-tema="terang"] .dek .lapis.kartu.b-lima::before { content:""; position:absolute; inset:1px; z-index:-1; background:#fff; clip-path:var(--c-lima); }
  :root[data-mono="1"][data-tema="terang"] .dek .balas.kartu.b-ledak { background:#000 !important; box-shadow:none; isolation:isolate; }
  :root[data-mono="1"][data-tema="terang"] .dek .balas.kartu.b-ledak::before { content:""; position:absolute; inset:1px; z-index:-1; background:#fff; clip-path:var(--c-ledak); }
  :root[data-mono="1"][data-tema="terang"] .dek .lapis.kartu.b-ledak { background:#000 !important; box-shadow:none; isolation:isolate; }
  :root[data-mono="1"][data-tema="terang"] .dek .lapis.kartu.b-ledak::before { content:""; position:absolute; inset:1px; z-index:-1; background:#fff; clip-path:var(--c-ledak); }
  :root[data-mono="1"][data-tema="gelap"] .dek .balas.kartu.b-enam { background:#fff !important; box-shadow:none; isolation:isolate; }
  :root[data-mono="1"][data-tema="gelap"] .dek .balas.kartu.b-enam::before { content:""; position:absolute; inset:1px; z-index:-1; background:#000; clip-path:var(--c-enam); }
  :root[data-mono="1"][data-tema="gelap"] .dek .lapis.kartu.b-enam { background:#fff !important; box-shadow:none; isolation:isolate; }
  :root[data-mono="1"][data-tema="gelap"] .dek .lapis.kartu.b-enam::before { content:""; position:absolute; inset:1px; z-index:-1; background:#000; clip-path:var(--c-enam); }
  :root[data-mono="1"][data-tema="gelap"] .dek .balas.kartu.b-lima { background:#fff !important; box-shadow:none; isolation:isolate; }
  :root[data-mono="1"][data-tema="gelap"] .dek .balas.kartu.b-lima::before { content:""; position:absolute; inset:1px; z-index:-1; background:#000; clip-path:var(--c-lima); }
  :root[data-mono="1"][data-tema="gelap"] .dek .lapis.kartu.b-lima { background:#fff !important; box-shadow:none; isolation:isolate; }
  :root[data-mono="1"][data-tema="gelap"] .dek .lapis.kartu.b-lima::before { content:""; position:absolute; inset:1px; z-index:-1; background:#000; clip-path:var(--c-lima); }
  :root[data-mono="1"][data-tema="gelap"] .dek .balas.kartu.b-ledak { background:#fff !important; box-shadow:none; isolation:isolate; }
  :root[data-mono="1"][data-tema="gelap"] .dek .balas.kartu.b-ledak::before { content:""; position:absolute; inset:1px; z-index:-1; background:#000; clip-path:var(--c-ledak); }
  :root[data-mono="1"][data-tema="gelap"] .dek .lapis.kartu.b-ledak { background:#fff !important; box-shadow:none; isolation:isolate; }
  :root[data-mono="1"][data-tema="gelap"] .dek .lapis.kartu.b-ledak::before { content:""; position:absolute; inset:1px; z-index:-1; background:#000; clip-path:var(--c-ledak); }
  #btn-foto { border:2px solid var(--h); padding:4px 10px; min-width:34px; display:inline-flex; align-items:center; justify-content:center; }
  html.foto header, html.foto #alat, html.foto #statistik, html.foto footer, html.foto #titik, html.foto #banner, html.foto #toast { visibility:hidden !important; }
  html.foto { background:#fff !important; }
  html.foto body { background:transparent !important; }
  html.foto .dek, html.foto .dek.rapi { zoom:1 !important; }
  #btn-suara { border:2px solid var(--h); padding:4px 10px; font-size:14px; min-width:34px; }
  #btn-suara.mati { opacity:.55; text-decoration:line-through; }
  #btn-tema, #btn-help { border:2px solid var(--h); padding:4px 10px; font-size:14px; min-width:34px; }
  .petunjuk { color:var(--h); background:#fff; padding:4px 10px; }
  #titik { position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; }
  .ikon { width:34px; height:34px; background:#9a9a9a; border:none; padding:0; cursor:pointer; flex-shrink:0; }
  .ikon.kecil { width:26px; height:26px; }
  .ikon:hover, .ikon.pilih { background:var(--h); }
  .ikon { transition:transform .16s cubic-bezier(.2,.8,.3,1), background-color .15s; }
  .ikon.pilih { transform:scale(1.1); }
  #alat .ikon { transform-origin:50% 100%; }
  @media (prefers-reduced-motion:reduce) { .ikon { transition:none; } }
  .ikon.b-lingkaran { border-radius:50%; }
  .ikon.b-enam { clip-path:var(--c-enam); }
  .ikon.b-ledak { clip-path:var(--c-ledak); }
  .ikon.b-lima { clip-path:var(--c-lima); }
  .ikon.b-tumpul { border-radius:7px; height:22px; margin:6px 0; }
  .ikon.kecil.b-tumpul { height:17px; margin:4px 0; border-radius:5px; }

  .dek { display:grid; grid-template-columns:repeat(auto-fill, minmax(310px, 1fr)); gap:30px 26px;
         align-items:start; margin:0; padding:14px 24px 40px; zoom:var(--z,1); }
  @media (min-width:641px) { .dek:not(.rapi) { min-width:calc(6 * 310px + 5 * 26px + 48px); grid-template-columns:repeat(auto-fit, 310px); justify-content:center; } }   /* mode Acak: minimal 6 kolom, geser ke samping; layar lebar menambah kolom otomatis */

  /* kartu */
  .kartu { background:var(--kuning); border:none; padding:16px 18px; }
  .kartu, .balas { font-family:'Shantell Sans','Segoe Print','Bradley Hand',cursive; }
  .item.terbuka { position:relative; margin-top:calc(var(--dy,0px) + 8px); margin-bottom:8px; padding:var(--pad, 16px); }
  .item.terbuka > .bingkai { position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; pointer-events:none; }
  .item.terbuka > .bingkai { z-index:-1; }
  .item.terbuka > .bingkai path { fill:#e6e6e6; stroke:none; }
  .item { transform:translateX(var(--dx,0)) rotate(var(--rot,0)); margin-top:var(--dy,0); }
  .kepala { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  /* centang dosen selalu biru, di semua tema dan semua jenis kartu (cincin putih tipis agar tetap terlihat di kartu biru/merah/oranye) */
  .lencana, :root[data-tema] .lencana, :root[data-mono="1"] .lencana, .dek .kartu .lencana, .poll .lencana, .tmr .lencana { background:#1d9bf0 !important; color:#fff !important; box-shadow:0 0 0 1.5px #fff; }
  .lencana { display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; margin-left:6px;
             border-radius:50%; background:#1d9bf0; color:#fff; font-size:12px; font-weight:900; line-height:1;
             vertical-align:2px; cursor:help; }
  .nama { font-weight:700; font-size:17px; overflow-wrap:anywhere; }
  .membalas { color:var(--abu); font-size:12px; margin-top:6px; overflow-wrap:anywhere; }
  .kartu.lain .membalas { order:1; text-align:center; margin-top:2px; }
  .balas > .bawah { margin-top:8px; font-size:13px; }
  .balas > .bawah .btn { font-size:12px; padding:3px 10px; }
  .kompos.popup { position:relative; z-index:4; margin:12px 0 4px; padding-top:8px; }
  .kompos.popup::before { content:''; position:absolute; top:-2px; left:34px; border:9px solid transparent; border-bottom-color:#000; border-top:0; }
  .ke { font-size:13px; color:var(--abu); margin:0 0 4px 4px; }
  .waktu { color:var(--abu); font-size:14px; margin-top:2px; }
  .teks { margin:10px 0 12px; text-align:justify; white-space:pre-wrap; overflow-wrap:anywhere; font-size:16px; }
  .aksi { display:flex; gap:6px; flex-shrink:0; }
  .bawah { display:flex; align-items:center; gap:12px; font-size:14px; color:var(--abu); }
  .kartu.lain .bawah { order:4; justify-content:center; gap:8px; margin-top:6px; font-size:12px; }
  .kartu.lain .bawah .btn { font-size:12px; padding:3px 10px; }

  /* bentuk selain persegi */
  .kartu.lain { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
                width:100%; max-width:330px; margin-left:auto; margin-right:auto; }
  .kartu.b-lingkaran { aspect-ratio:1; border-radius:50%; padding:15% 14%; }
  .kartu.b-enam { aspect-ratio:1.15; clip-path:var(--c-enam); padding:8% 19%; }
  .kartu.b-lima { aspect-ratio:1; clip-path:var(--c-lima); padding:24% 20% 9%; }
  .kartu.b-ledak { aspect-ratio:1.3; clip-path:var(--c-ledak); padding:15% 17%; }
  .kartu.b-tumpul { aspect-ratio:1.7; border-radius:22px; padding:7% 8%; }
  .kartu.lain .kepala { display:contents; }
  .kartu.lain .kepala > div:first-child { order:1; }
  .kartu.lain .nama { font-size:15px; }
  .kartu.lain .waktu { font-size:12px; margin-top:0; white-space:nowrap; }
  .kartu.lain .teks { order:2; margin:6px 0 8px; text-align:center; font-size:14px; }
  .kartu.lain .aksi { order:3; justify-content:center; }
  .kartu.lain .btn.garis { font-size:12px; padding:3px 8px; }

  /* titik sambungan antar kartu */
  .tt { display:inline-block; width:18px; height:18px; border-radius:50%; background:#fff; border:2px solid #222; position:relative; flex-shrink:0; margin-left:2px; opacity:.55; }
  .tt::before { content:''; position:absolute; inset:-9px; }
  .tt::after { content:''; position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:#222; }
  .tt.milik { opacity:1; cursor:crosshair; touch-action:none; }
  .tt.aktif { background:#222; }
  .tt.aktif::after { background:#fff; }
  article.kartu.sasaran { outline:3px dashed #222; outline-offset:5px; }
  #garis { position:absolute; left:0; top:0; z-index:6; pointer-events:none; overflow:visible; }
  .terhubung { display:none; flex-wrap:wrap; gap:4px 8px; font-size:12px; margin-top:8px; }
  .terhubung button { font:inherit; background:none; border:none; border-bottom:1px solid currentColor; padding:0; cursor:pointer; color:inherit; }
  @media (max-width:640px) { .terhubung { display:flex; } .kartu.lain .terhubung { justify-content:center; order:5; } }

  /* tombol */

function parseCSV(t) {
  const rows = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); c = ''; rows.push(r); r = []; }
    else c += ch;
  }
  if (c !== '' || r.length) { r.push(c); rows.push(r); }
  return rows;
}
function dariCSV(teks) {
  const rows = parseCSV(teks); if (rows.length < 2) return [];
  const kop = rows[0].map(s => s.trim().toLowerCase());
  return rows.slice(1).map(r => { const o = {}; kop.forEach((k, i) => o[k] = r[i] ?? ''); return o; });
}
function bacaPoll(t) {   // kolom 'polling' berisi JSON { o: [pilihan], h: [jumlah suara], akhir: ms }
  if (!t) return null;
  try {
    const j = typeof t === 'string' ? JSON.parse(t) : t;
    if (!j || !Array.isArray(j.o) || j.o.length < 2 || j.o.length > MAKS_OPSI_N || !(Number(j.akhir) > 0)) return null;
    return { o: j.o.map(x => String(x).slice(0, MAKS_OPSI)), h: j.o.map((_, i) => Math.max(0, parseInt((j.h || [])[i]) || 0)), akhir: Number(j.akhir) };
  } catch (e) { return null; }
}

let muatJalan = false;
async function muat(otomatis) {
  if (!sb) return;
  if (otomatis && (document.hidden || sedangMengetik() || (seret && seret.mode === 'tarik'))) { muatTunda = true; return; }
  if (muatJalan) { muatUlang = true; return; }
  muatJalan = true; muatTunda = false;
  sinkronMulai();
  try {
    const t0 = Date.now();
    const [r, w, st, rg] = await Promise.all([
      sb.from('posts').select('*').order('waktu', { ascending: true }).limit(5000),
      sb.rpc('kini_ms'),
      ambilStiker(),
      sb.from('ruang').select('*').order('urut', { ascending: true }).limit(60)
    ]);
    if (r.error) throw r.error;
    if (!w.error && Number(w.data) > 0) skew = Number(w.data) - (t0 + Date.now()) / 2;
    dataServer = (r.data || []).map(normal).filter(p => p.id && p.teks);
    if (!rg.error && Array.isArray(rg.data)) {   // tabel ruang belum ada / gagal dibaca: pertahankan yang lama
      ruangData = rg.data;
      if (ruangSaya && !ruangData.some(x => x.id === ruangSaya)) { ruangSaya = ''; simpanRuang(); hadirKirim(); toast('Ruang ini ditutup. Kartunya digabung ke papan utama.'); }
      renderRuang();
    }
    if (st) stikerData = st;   // null = tabel stiker belum ada / gagal dibaca: pertahankan yang lama
    // data dari server adalah kebenaran: tutupan sementara tidak diperlukan lagi
    lokal = []; override = {}; ovPoll = {}; ovTautan = {}; ovHapus = {}; ovBuka = {}; ovGame = {};
    {   // bunyi "dek dek" bila ada kartu baru dari orang lain
      const kini = new Set(dataServer.filter(p => p.ruang === ruangSaya).map(p => p.id));
      const baru = (suaraKead.dikenal && otomatis) ? dataServer.filter(p => p.ruang === ruangSaya && !suaraKead.dikenal.has(p.id) && !milikSaya.has(p.id)) : [];
      if (baru.length) bunyiDekdek();
      if (baru.length && bacaAktif) {
        const bisa = baru.filter(p => !tersegel(p));
        if (bisa.length) umumkan(bisa.length === 1 ? 'Kartu baru dari ' + bisa[0].username : bisa.length + ' kartu baru dari ' + [...new Set(bisa.map(p => p.username))].slice(0, 3).join(', '));
        if (bacaOtomatis && bisa.length) bacaTambah(bisa.map(p => ({ teks: bacaanSatu(p) })));
      }
      suaraKead.dikenal = kini;
    }
    render();
  } catch (e) { if (!otomatis) toast('Gagal memuat data.'); }
  finally { muatJalan = false; sinkronSelesai(); if (muatUlang) { muatUlang = false; muat(true); } }
}

/* Realtime: setiap perubahan pada tabel kartu memicu muat ulang (digabung bila beruntun) */
let tRealtime = null;
function realtimeMulai() {
  if (!sb) return;
  sb.channel('kartu-berubah').on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, p => {
    // kartu di ruang lain tidak perlu memuat ulang layar ini (hapus tidak membawa info ruang, jadi tetap dimuat)
    if (p && p.new && p.eventType !== 'DELETE' && String(p.new.ruang_id || '') !== ruangSaya) return;
    clearTimeout(tRealtime); tRealtime = setTimeout(() => muat(true), 350);
  }).on('postgres_changes', { event: '*', schema: 'public', table: 'ruang' }, () => {
    clearTimeout(tRealtime); tRealtime = setTimeout(() => muat(true), 350);
  }).on('postgres_changes', { event: '*', schema: 'public', table: 'stiker' }, p => {   // stiker: ubah langsung di tempatnya, tanpa memuat ulang papan
    if (p.eventType === 'INSERT' && p.new) terapkanStiker(p.new);
    else if (p.eventType === 'DELETE' && p.old && p.old.id) buangStiker(p.old.id);
  }).subscribe();
  document.addEventListener('focusout', () => { if (muatTunda) setTimeout(() => muat(true), 300); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) muat(true); });
}
function sedangMengetik() {
  if (diktat) return true;   // sedang berdikte: jangan membongkar kotak tulis
  const a = document.activeElement;
  return !!a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && /^(text|search|email|tel|url|number)?$/.test(a.type))) && (document.getElementById('dek').contains(a) || document.getElementById('baca').contains(a));
}
function semua() {
  const m = new Map();
  dataServer.forEach(p => m.set(p.id, { ...p }));
  lokal.forEach(p => { if (!m.has(p.id)) m.set(p.id, { ...p }); });
  const now = Date.now();
  for (const [id, o] of Object.entries(override)) {
    const p = m.get(id); if (p && now - o.t < 360000) { p.up = o.up; p.down = o.down; }
  }
  for (const [id, t] of Object.entries(ovHapus)) { if (now - t < 600000) m.delete(id); }
  if (tombServer.ids.size || tombServer.reset) [...m.values()].forEach(p => {
    if (tombServer.ids.has(p.id) || (p.parent && tombServer.ids.has(p.parent)) || (tombServer.reset && !lokal.some(l => l.id === p.id) && Date.parse(p.waktu) < tombServer.reset)) m.delete(p.id);
  });
  for (const [id, o] of Object.entries(ovPoll)) { const p = m.get(id); if (p && p.poll && now - o.t < 360000) p.poll = { ...p.poll, h: o.h.slice() }; }
  { const kini = waktuServer(), mati = new Set(); m.forEach(p => { if (p.habis && p.habis <= kini) mati.add(p.id); }); if (mati.size) [...m.values()].forEach(p => { if (mati.has(p.id) || mati.has(p.parent)) m.delete(p.id); }); }
  for (const [id, t] of Object.entries(ovBuka)) { const p = m.get(id); if (p) { p.teks = t; if (p.parent) p.game = 2; } }
  for (const [id, a] of Object.entries(ovGame)) { const p = m.get(id); if (p && p.game < a) p.game = a; }
  for (const [id, o] of Object.entries(ovTautan)) { const p = m.get(id); if (p && now - o.t < 360000) p.tautan = o.a; }
  return [...m.values()].filter(p => p.ruang === ruangSaya);
}
const skor = p => p.up - p.down;

const PESAN = {
  LOGIN: 'Sesi login habis. Silakan masuk lagi dengan Google.',
  DILARANG: 'Akun belum terdaftar atau sedang diblokir.'
};
let sinkronN = 0, sinkronAwal = 0, sinkronTunda = null;
// ikon sinkron: menyala saat ada permintaan ke server, minimal 0,7 detik supaya sempat terlihat
function sinkronMulai() {
  sinkronN++; if (sinkronTunda) { clearTimeout(sinkronTunda); sinkronTunda = null; }
  const el = document.getElementById('sinkron'); if (!el) return;
  if (!el.classList.contains('on')) { sinkronAwal = Date.now(); el.classList.add('on'); el.removeAttribute('aria-hidden'); }
}
function sinkronSelesai() {
  sinkronN = Math.max(0, sinkronN - 1); if (sinkronN) return;
  const sisa = Math.max(0, 700 - (Date.now() - sinkronAwal));
  sinkronTunda = setTimeout(() => { sinkronTunda = null; if (sinkronN) return; const el = document.getElementById('sinkron'); if (el) { el.classList.remove('on'); el.setAttribute('aria-hidden', 'true'); } }, sisa);
}
async function panggil(isi) {
  sinkronMulai();
  try { return await panggilInti(isi); } finally { sinkronSelesai(); }
}
// peta aksi lama -> fungsi database (nama dan parameter sama dengan skema.sql)
const RPC = {
  saya:    () => ['saya', {}],
  daftar:  () => ['daftar', {}],
  vote:    i => ['vote', { p_id: i.id, p_nilai: i.nilai }],
  hapus:   i => ['hapus', { p_id: i.id }],
  pilih:   i => ['pilih', { p_id: i.id, p_indeks: i.indeks }],
  tempel:  i => ['tempel', { p_id: i.id, p_jenis: i.jenis, p_x: i.x, p_y: i.y }],
  lepas:   i => ['lepas', { p_id: i.id }],
  ronde:   i => ['ronde', { p_id: i.id }],
  tampil:  i => ['tampil', { p_id: i.id }],
  tautan:  i => ['tautan', { p_id: i.id, p_ke: i.ke }],
  polling: i => ['buat_polling', { p: { username: i.username, tanya: i.tanya, opsi: i.opsi, menit: i.menit, ruang: ruangSaya } }],
  buatRuang: i => ['buat_ruang', { p: { awalan: i.awalan, jumlah: i.jumlah } }],
  tutupRuang: i => ['tutup_ruang', { p_id: i.id || null }],
  post:    i => ['kirim', { p: { username: i.username, teks: i.teks, parent: i.parent || '', membalas: i.membalas || '', warna: i.warna, kartu: i.kartu, bentuk: i.bentuk, menit: i.menit, game: i.game ? 'true' : '', ruang: ruangSaya } }]
};
async function panggilInti(isi) {
  if (!sb) throw new Error('Pustaka Supabase belum termuat. Muat ulang halaman.');
  const f = RPC[isi.aksi]; if (!f) throw new Error('Aksi tidak dikenal.');
  const [nama, args] = f(isi);
  const { data, error } = await sb.rpc(nama, args);
  if (error) {
    const m = String(error.message || '');
    if (m === 'LOGIN') keluar(true);
    if (/sudah ditutup/.test(m)) muat();   // ruang tutup saat mengetik: segarkan daftar ruang
    throw new Error(PESAN[m] || m || 'Terjadi kesalahan.');
  }
  return data || {};
}

(function dokMulai() {
  const bar = document.getElementById('alat');
  const MAKS = 1.7, SEBAR = 52;   // skala tertinggi dan lebar pengaruh (px)
  const ikon = () => [...bar.querySelectorAll('.ikon')];
  const reset = () => ikon().forEach(k => { k.style.transform = ''; });
  bar.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    const L = ikon(); if (!L.length) return;
    const px = e.clientX - bar.getBoundingClientRect().left;   // satu sistem koordinat dengan offsetLeft
    const info = L.map(k => {
      const w = k.offsetWidth, c = k.offsetLeft + w / 2, d = (px - c) / SEBAR;
      const s = Math.max(k.classList.contains('pilih') ? 1.1 : 1, 1 + (MAKS - 1) * Math.exp(-d * d));
      return { k, w, c, s, tambah: w * (s - 1) };

    const total = info.reduce((a, o) => a + o.tambah, 0);
    const awal = info[0].k.offsetLeft, lebar = info[info.length - 1].k.offsetLeft + info[info.length - 1].w - awal;
    const rasio = Math.min(1, Math.max(0, (px - awal) / (lebar || 1)));   // ikon di bawah kursor tetap di tempatnya
    let kiri = 0;
    info.forEach(o => {
      const geser = kiri + o.tambah / 2 - total * rasio; kiri += o.tambah;
      o.k.style.transform = `translateX(${geser.toFixed(1)}px) scale(${o.s.toFixed(3)})`;
    });
  });
  bar.addEventListener('pointerleave', reset);
  bar.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') reset(); });
})();

const FOTO_LIB = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';

  const root = document.documentElement, rapiLama = rapi, temaLama = root.dataset.tema, gulirX = scrollX, gulirY = scrollY;

    // batas isi: gabungan semua kartu dan balasan

    document.querySelectorAll('#dek .kartu:not(.lapis), #dek .balas').forEach(el => {

    const g = out.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height);
    g.drawImage(penuh, Math.round(l * pr), Math.round(t * pr), out.width, out.height, 0, 0, out.width, out.height);
    return await new Promise((ok, gagal) => out.toBlob(x => x ? ok(x) : gagal(new Error('blob')), 'image/png'));
  } finally {

  }
}

(function pintasanSuara() {

  document.addEventListener('keydown', e => {
    if (!(e.code in tahan)) return;

    tahan[e.code] = true;

  addEventListener('blur', () => { tahan.Space = tahan.KeyZ = false; dipakai = false; });

const STIKER = [['senyum', '\u{1F600}', 'Senyum'], ['jempol', '\u{1F44D}', 'Jempol'], ['hati', '❤️', 'Hati'], ['api', '\u{1F525}', 'Api'], ['ide', '\u{1F4A1}', 'Ide'], ['tanya', '❓', 'Tanya'],

const STIKER_EMOJI = Object.fromEntries(STIKER.map(([k, e]) => [k, e]));

async function ambilStiker() {
  if (!sb) return null;
  const hasil = [];
  for (let i = 0; i < 20; i++) {
    const { data, error } = await sb.from('stiker').select('*').order('waktu', { ascending: true }).range(i * 1000, i * 1000 + 999);
    if (error) return null;
    hasil.push(...(data || [])); if (!data || data.length < 1000) break;
  }

}
function elemenStiker(s) {

function isiLapis(el) { const id = el.dataset.stk; el.replaceChildren(...stikerData.filter(s => s.post_id === id).map(elemenStiker)); }

function teksReset(ms) {   // sisa waktu reset, selalu sampai detik: 10 jam : 46 menit : 07 detik
  const dua = n => String(n).padStart(2, '0'), d = Math.max(0, Math.floor(ms / 1000));
  return dua(Math.floor(d / 3600)) + ' jam : ' + dua(Math.floor(d % 3600 / 60)) + ' menit : ' + dua(d % 60) + ' detik';
}
function teksTimer(ms) {
  const dua = n => String(n).padStart(2, '0');
  const hari = Math.floor(ms / 86400000), jam = Math.floor(ms % 86400000 / 3600000);
  const menit = Math.floor(ms % 3600000 / 60000), detik = Math.floor(ms % 60000 / 1000);
  if (hari > 0) return `${hari} hari : ${dua(jam)} jam`;
  if (jam > 0) return `${jam} jam : ${dua(menit)} menit`;
  return `${menit} menit : ${dua(detik)} detik`;
}
function tickTimer() {
  const el = document.getElementById('timer');
  if (el) el.textContent = '[' + teksReset(sisaReset(waktuServer())) + ']';
  let habis = false;
  document.querySelectorAll('.poll-sisa').forEach(s => {
    const a = Number(s.dataset.akhir), t = sisaPoll(a);
    if (s.textContent !== t) s.textContent = t;
    if (s.dataset.aktif === '1' && a <= Date.now()) { s.dataset.aktif = ''; habis = true; }
  });
  const kini = waktuServer();
  let padam = false;
  document.querySelectorAll('.tmr-sisa').forEach(sp => {
    const a = Number(sp.dataset.habis), tx = sisaKartu(a);
    if (sp.textContent !== tx) sp.textContent = tx;
    if (a <= kini && !sedangMengetik()) { const it = sp.closest('.item'); if (it && !it.classList.contains('padam')) { it.classList.add('padam'); padam = true; } }
  });
  gameCek();
  if (padam) setTimeout(() => { if (!sedangMengetik()) render(); }, 700);
  if (habis && !sedangMengetik()) render();   // polling baru saja selesai: kunci pilihan
}

/* ================== KETERANGAN TOMBOL (muncul saat kursor diarahkan) ================== */
(function tipMulai() {
  const tip = document.getElementById('tip');
  let aktif = null;
  const tutup = () => { aktif = null; tip.hidden = true; };
  document.addEventListener('pointerover', e => {
    if (e.pointerType !== 'mouse') return;
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el || el === aktif) return;
    aktif = el; tip.textContent = el.dataset.tip; tip.hidden = false;
    const r = el.getBoundingClientRect();
    tip.style.left = Math.max(40, Math.min(innerWidth - 40, r.left + r.width / 2)) + 'px';
    tip.style.top = (r.top < 40 ? r.bottom + 34 : r.top - 6) + 'px';
  });
  document.addEventListener('pointerout', e => { if (aktif && !(e.relatedTarget && aktif.contains(e.relatedTarget))) tutup(); });
  document.addEventListener('pointerdown', tutup, true);
  addEventListener('scroll', tutup, { passive: true });
})();

/* ================== PETA KARTU (MINIMAP) ================== */
function petaMulai() {
  const kotakPeta = document.getElementById('peta'), tb = document.getElementById('peta-judul');
  const kv = document.getElementById('peta-kanvas'), cv = kv.querySelector('canvas'), kt = document.getElementById('peta-kotak');
  const LEBAR = 190, MAKS_T = 0.4;
  let skala = 1, ttl = 0, zoom = 1, sudahTengah = false;
  try { if (localStorage.getItem('deck-peta') === '0') kotakPeta.classList.add('tutup'); } catch (e) {}
  const lipat = () => tb.setAttribute('aria-expanded', kotakPeta.classList.contains('tutup') ? 'false' : 'true');
  lipat();
  tb.addEventListener('click', () => {
    kotakPeta.classList.toggle('tutup'); lipat();
    try { localStorage.setItem('deck-peta', kotakPeta.classList.contains('tutup') ? '0' : '1'); } catch (e) {}
    gambar();
  });

  /* ----- zoom (tombol, Ctrl + gulir / cubit) dan geser dengan menyeret latar ----- */
  const root = document.documentElement, dekEl = document.getElementById('dek'), nilai = document.getElementById('pz-nilai');
  function setZoom(z, cx, cy) {
    z = Math.max(.4, Math.min(1.6, Math.round(z * 100) / 100));
    if (z === zoom) return;
    const r = z / zoom, T = dekEl.getBoundingClientRect().top + scrollY;
    if (cx == null) { cx = innerWidth / 2; cy = innerHeight / 2; }
    const x0 = scrollX, y0 = scrollY;
    zoom = z; root.style.setProperty('--z', z); nilai.textContent = Math.round(z * 100) + '%';
    void dekEl.offsetHeight;
    scrollTo((x0 + cx) * r - cx, (y0 + cy - T) * r + T - cy);
    requestAnimationFrame(() => { gambarBingkai(); gambarGaris(); gambar(); });
  }
  document.getElementById('pz-min').addEventListener('click', () => setZoom(zoom / 1.2));
  document.getElementById('pz-plus').addEventListener('click', () => setZoom(zoom * 1.2));
  nilai.addEventListener('click', () => setZoom(1));
  addEventListener('wheel', e => {
    if (!e.ctrlKey || e.target.closest('textarea, input, #bantuan')) return;
    e.preventDefault();
    setZoom(zoom * Math.exp(-Math.max(-40, Math.min(40, e.deltaY)) * .008), e.clientX, e.clientY);
  }, { passive: false });
  // menyeret latar kosong menggeser papan (mouse; di layar sentuh geser jari bekerja biasa)
  let pan = null;
  document.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    if (e.target.closest('article, .item, button, a, input, textarea, select, summary, header, #peta, #statistik, #alat, #bantuan, .kompos, [role=menu]')) return;
    pan = { x: e.clientX, y: e.clientY, sx: scrollX, sy: scrollY };
  });
  document.addEventListener('pointermove', e => {
    if (!pan) return;
    if (!root.classList.contains('geser')) { if (Math.hypot(e.clientX - pan.x, e.clientY - pan.y) < 4) return; root.classList.add('geser'); }
    scrollTo(pan.sx - (e.clientX - pan.x), pan.sy - (e.clientY - pan.y));
  });
  const akhirPan = () => { pan = null; root.classList.remove('geser'); };
  document.addEventListener('pointerup', akhirPan); document.addEventListener('pointercancel', akhirPan);
  // tinggi header tetap (fixed) disisihkan lewat padding body
  const hd = document.querySelector('header');
  const ukurH = () => root.style.setProperty('--hh', hd.offsetHeight + 'px');
  ukurH(); if (window.ResizeObserver) new ResizeObserver(ukurH).observe(hd); else addEventListener('resize', ukurH);
  function petaTengah() { scrollTo(Math.max(0, (dokW() - innerWidth) / 2), scrollY); }
  window.petaTengah = petaTengah;
  const dokW = () => Math.max(document.documentElement.scrollWidth, innerWidth);
  const dokH = () => Math.max(document.documentElement.scrollHeight, innerHeight);
  function gambar() {
    const dek = document.getElementById('dek');
    const perlu = dokH() > innerHeight + 4 || dokW() > innerWidth + 4 || zoom !== 1;
    const ada = dek && dek.querySelector('.item, .kartu');
    if (ada && !sudahTengah) { sudahTengah = true; if (scrollX === 0) petaTengah(); }
    kotakPeta.hidden = !(perlu && ada);
    if (kotakPeta.hidden || kotakPeta.classList.contains('tutup')) return;
    const W = dokW(), H = dokH();
    skala = Math.min(LEBAR / W, (innerHeight * MAKS_T) / H);
    const cw = Math.max(1, Math.round(W * skala)), ch = Math.max(1, Math.round(H * skala));
    kv.style.width = cw + 'px'; kv.style.height = ch + 'px';
    const r = devicePixelRatio || 1;
    cv.width = Math.round(cw * r); cv.height = Math.round(ch * r); cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    const c = cv.getContext('2d'); c.setTransform(r, 0, 0, r, 0, 0); c.clearRect(0, 0, cw, ch);
    c.fillStyle = getComputedStyle(kotakPeta).color; c.globalAlpha = .5;
    let els = [...dek.querySelectorAll('.item')];
    if (!els.length) els = [...dek.querySelectorAll('article.kartu')];
    els.forEach(el => {
      const b = el.getBoundingClientRect();
      if (b.width < 2 || b.height < 2) return;
      const x = (b.left + scrollX) * skala, y = (b.top + scrollY) * skala;
      c.fillRect(x, y, Math.max(2, b.width * skala), Math.max(2, b.height * skala));
    });
    c.globalAlpha = 1;
    kotak();
  }
  function kotak() {
    kt.style.left = scrollX * skala + 'px'; kt.style.top = scrollY * skala + 'px';
    kt.style.width = Math.min(innerWidth * skala, kv.clientWidth) + 'px'; kt.style.height = innerHeight * skala + 'px';
  }
  const tunda = () => { clearTimeout(ttl); ttl = setTimeout(gambar, 120); };
  function pindah(e) {
    const b = kv.getBoundingClientRect();
    const x = (e.clientX - b.left) / skala - innerWidth / 2, y = (e.clientY - b.top) / skala - innerHeight / 2;
    scrollTo(Math.max(0, x), Math.max(0, y));
  }
  let seret = false;
  kv.addEventListener('pointerdown', e => { seret = true; try { kv.setPointerCapture(e.pointerId); } catch (x) {} pindah(e); e.preventDefault(); });
  kv.addEventListener('pointermove', e => { if (seret) pindah(e); });
  const lepas = () => { seret = false; };
  kv.addEventListener('pointerup', lepas); kv.addEventListener('pointercancel', lepas);
  addEventListener('scroll', kotak, { passive: true });
  addEventListener('resize', tunda);
  const dek = document.getElementById('dek');
  if (window.ResizeObserver) new ResizeObserver(tunda).observe(dek);
  new MutationObserver(tunda).observe(dek, { childList: true, subtree: true });
  new MutationObserver(tunda).observe(document.documentElement, { attributes: true, attributeFilter: ['data-tema', 'data-mono'] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(tunda);
  gambar();
}

/* ================== MULAI ================== */
(function temaMulai() {
  const root = document.documentElement, tb = document.getElementById('btn-tema'), menu = document.getElementById('menu-tema');
  const PIL = [['terang', '☀', 'Terang'], ['gelap', '☾', 'Gelap'], ['mono-terang', '○', 'Monokrom terang'], ['mono-gelap', '●', 'Monokrom gelap']];
  let t = null;
  try { t = localStorage.getItem('deck-tema'); } catch (e) {}
  if (!PIL.some(x => x[0] === t)) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'gelap' : 'terang';
  const tombol = PIL.map(([k, ik, nm]) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = ik; b.title = nm; b.setAttribute('aria-label', nm); b.setAttribute('role', 'menuitemradio');
    b.addEventListener('click', () => { t = k; try { localStorage.setItem('deck-tema', t); } catch (e) {} pasang(); tutup(); });
    menu.appendChild(b); return b;
  });
  // tombol ✕: matikan / nyalakan latar tanda ^ (terpisah dari pilihan tema)
  const bx = document.createElement('button'); bx.type = 'button'; bx.textContent = '⊘'; bx.setAttribute('role', 'menuitemcheckbox'); menu.appendChild(bx);
  // tombol ≋: ganti latar tanda ^ dengan latar spektrum
  const bs = document.createElement('button'); bs.type = 'button'; bs.textContent = '≋'; bs.setAttribute('role', 'menuitemcheckbox'); menu.insertBefore(bs, bx);
  const modeLatar = m => {
    titik.mode = m; bs.classList.toggle('aktif', m === 'spektrum'); bs.setAttribute('aria-checked', m === 'spektrum' ? 'true' : 'false');
    const nm = m === 'spektrum' ? 'Latar spektrum (aktif): klik untuk kembali ke tanda ^' : 'Latar spektrum'; bs.title = nm; bs.setAttribute('aria-label', nm);
    if (titik.kanvas) { titikUkuran(); if (titik.ctx) { titik.ctx.clearRect(0, 0, innerWidth, innerHeight); titikMinta(); } }
  };
  let mode = 'caret';
  try { if (localStorage.getItem('deck-mode') === 'spektrum') mode = 'spektrum'; } catch (e) {}
  const latar = mati => {
    titik.mati = mati;
    if (mati) root.dataset.latar = 'mati'; else delete root.dataset.latar;
    bx.classList.toggle('aktif', mati); bx.setAttribute('aria-checked', mati ? 'true' : 'false');
    const nm = mati ? 'Nyalakan latar' : 'Matikan latar'; bx.title = nm; bx.setAttribute('aria-label', nm);
    if (titik.kanvas) { titikUkuran(); if (!mati) titikMinta(); }   // mati: kanvas dikosongkan (memori dan CPU bebas)
  };
  let mati = false;
  try { const sv = localStorage.getItem('deck-latar'); mati = sv === null ? PERANGKAT_LEMAH : sv === 'mati'; } catch (e) { mati = PERANGKAT_LEMAH; }   // perangkat lemah: latar mati sebagai bawaan
  latar(mati); modeLatar(mode);
  // dipanggil pengawas bingkai bila latar membuat halaman patah-patah
  titik.lambat = () => {
    mati = true; try { localStorage.setItem('deck-latar', 'mati'); } catch (e) {}
    latar(true); toast('Latar dimatikan otomatis karena perangkat terasa berat. Nyalakan lagi lewat menu tema (\u2299).');
  };
  bs.addEventListener('click', () => { mode = mode === 'spektrum' ? 'caret' : 'spektrum'; try { localStorage.setItem('deck-mode', mode); } catch (e) {} if (mati) { mati = false; try { localStorage.setItem('deck-latar', 'hidup'); } catch (e) {} latar(false); } modeLatar(mode); tutup(); });
  bx.addEventListener('click', () => { mati = !mati; try { localStorage.setItem('deck-latar', mati ? 'mati' : 'hidup'); } catch (e) {} latar(mati); tutup(); });
  const tutup = () => { menu.hidden = true; tb.setAttribute('aria-expanded', 'false'); };
  const pasang = () => {
    const gelap = t === 'gelap' || t === 'mono-gelap', mono = t.indexOf('mono') === 0;
    root.dataset.tema = gelap ? 'gelap' : 'terang';
    if (mono) root.dataset.mono = '1'; else delete root.dataset.mono;
    const cur = PIL.find(x => x[0] === t);
    tb.textContent = cur[1]; tb.title = 'Tampilan: ' + cur[2];
    PIL.forEach((x, i) => { tombol[i].classList.toggle('aktif', x[0] === t); tombol[i].setAttribute('aria-checked', x[0] === t ? 'true' : 'false'); });
    TITIK.warna = gelap ? '#5c5c5c' : '#9a9a9a'; titik.gelap = gelap; titik.mono = mono;
    dispatchEvent(new Event('resize'));   // gambar ulang latar
  };
  tb.addEventListener('click', e => { e.stopPropagation(); const buka = menu.hidden; menu.hidden = !buka; tb.setAttribute('aria-expanded', buka ? 'true' : 'false'); });
  document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) tutup(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) tutup(); });
  window.setTemaNetra = () => { t = (t === 'gelap' || t === 'mono-gelap') ? 'mono-gelap' : 'mono-terang'; try { localStorage.setItem('deck-tema', t); } catch (e) {} pasang(); };
  pasang();
})();
(function urutMulai() {
  const sel = document.getElementById('urut');
  try { const v = localStorage.getItem('deck-urut'); if (v === 'terbaru' || v === 'nama') urutan = v; } catch (e) {}
  sel.value = urutan;
  sel.addEventListener('change', () => {
    urutan = sel.value; try { localStorage.setItem('deck-urut', urutan); } catch (e) {}
    render();
  });
})();
(function rapiMulai() {
  const tb = document.getElementById('btn-rapi');
  try { rapi = localStorage.getItem('deck-rapi') === '1'; } catch (e) {}
  const pasang = () => { tb.setAttribute('aria-pressed', rapi ? 'true' : 'false'); tb.textContent = rapi ? '▦ Rapi' : '▦ Acak'; };
  tb.addEventListener('click', () => {
    rapi = !rapi; try { localStorage.setItem('deck-rapi', rapi ? '1' : '0'); } catch (e) {}
    pasang(); bunyiSebar(rapi); render();
    if (!rapi && window.petaTengah) requestAnimationFrame(petaTengah);   // kembali ke Acak: mulai dari tengah kanvas
  });
  pasang();
})();
(function mulai() {
  const b = document.getElementById('banner');
  if (!sb) {
    b.append(h('div', {}, 'Pustaka Supabase gagal dimuat. Periksa koneksi lalu muat ulang halaman.'));
  }
  renderAlat(); render(); muat();
  gerbangNetra();
  tickTimer(); setInterval(tickTimer, 1000);
  setInterval(() => { const el = document.getElementById('timer'); if (el) el.textContent = '[' + teksReset(sisaReset(waktuServer())) + ']'; }, 250);   // angka detik tidak melompat
  titikMulai(); tautMulai(); statMulai(); petaMulai();
  addEventListener('resize', gambarBingkai);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(gambarBingkai);
  bantuanMulai();
  setInterval(() => muat(true), CONFIG.REFRESH_MS);
  renderLogin(); authMulai(); realtimeMulai();
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
